name: CI

on:
  push:
  pull_request:

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Executar testes da biblioteca padrão
        run: python -m unittest discover -s tests -v
      - name: Reproduzir relatório e artefatos
        run: python scripts/run_analysis.py
      - name: Verificar saídas esperadas
        run: test -s outputs/summary.csv && test -s outputs/relatorio.html && test -s outputs/grafico_residentes.svg && test -s outputs/grafico_transito.svg
